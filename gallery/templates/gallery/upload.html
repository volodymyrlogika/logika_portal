{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Додати фото/відео</h2>
  <form method="post" enctype="multipart/form-data" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-primary">Завантажити</button>
    <a href="{% url 'gallery:home' %}" class="btn btn-secondary">Назад до галереї</a>
  </form>
</div>
{% endblock %}
