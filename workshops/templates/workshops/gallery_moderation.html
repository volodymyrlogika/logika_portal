{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl mb-3">Модерація галереї</h1>
<div class="row g-3">
  {% for item in items %}
    <div class="col-md-3">
      <div class="bg-dark p-2 rounded h-100">
        {% if item.media_type == 'image' %}
          <img src="{{ item.file.url }}" alt="{{ item.title }}" class="img-fluid rounded">
        {% else %}
          <video src="{{ item.file.url }}" controls class="w-100 rounded"></video>
        {% endif %}
        <div class="small mt-1">{{ item.title }} — {{ item.uploader }}</div>
        <div class="d-flex gap-2 mt-2">
          <a class="btn btn-sm btn-success" href="{% url 'workshops:gallery_approve' item.pk %}">Схвалити</a>
          <a class="btn btn-sm btn-outline-danger" href="{% url 'workshops:gallery_delete' item.pk %}">Видалити</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p class="text-muted">Немає матеріалів, що очікують модерації.</p>
  {% endfor %}
</div>
{% endblock %}
