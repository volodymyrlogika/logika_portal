{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl mb-3">Завантажити до галереї</h1>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success">Надіслати на модерацію</button>
</form>
<p class="text-muted small mt-2">Після відправки матеріал побачать лише модератори. Публікація відбудеться після схвалення.</p>
{% endblock %}
