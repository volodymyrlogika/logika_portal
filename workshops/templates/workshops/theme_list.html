{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl mb-4">Теми</h1>
<div class="mb-3"><a class="btn btn-primary" href="{% url 'workshops:theme_create' %}">Створити тему</a></div>
<ul class="list-group">
  {% for t in themes %}
    <li class="list-group-item bg-dark text-light d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-bold">{{ t.name }}</div>
        <div class="text-muted small">{{ t.description|default:'Без опису' }}</div>
      </div>
      <div>
        <a class="btn btn-sm btn-outline-light" href="{% url 'workshops:theme_edit' t.pk %}">Редагувати</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'workshops:theme_delete' t.pk %}">Видалити</a>
      </div>
    </li>
  {% empty %}
    <li class="list-group-item bg-dark text-light">Поки що немає тем.</li>
  {% endfor %}
</ul>
{% endblock %}
