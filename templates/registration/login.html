{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm p-4">
        <h3 class="text-center mb-3">Увійти</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Увійти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
