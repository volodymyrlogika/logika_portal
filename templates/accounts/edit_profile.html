{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <h2 class="mb-4">Редагувати профіль</h2>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_theme" class="form-label">Тема</label>
      {{ form.theme }}
    </div>

    <button type="submit" class="btn btn-success">Зберегти</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Скасувати</a>
  </form>
</div>
{% endblock %}
