<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm rounded-3 p-4">
        <h3 class="card-title mb-4 text-center">Редагувати профіль</h3>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Аватар -->
          <div class="mb-3 text-center">
            <img src="{{ user.profile.avatar.url|default:'/static/img/default-avatar.png' }}"
                 class="rounded-circle mb-2"
                 style="width:100px; height:100px; object-fit:cover;" alt="avatar">
            <input type="file" name="avatar" class="form-control mt-2">
          </div>

          <!-- Ім'я користувача -->
          <div class="mb-3">
            <label for="username" class="form-label">Ім'я користувача</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ user.username }}">
          </div>

          <!-- Біо -->
          <div class="mb-3">
            <label for="bio" class="form-label">Біо</label>
            <textarea class="form-control" id="bio" name="bio" rows="3">{{ user.profile.bio }}</textarea>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Емейл</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
          </div>

          <!-- Кнопки Bootstrap -->
          <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i> Зберегти
            </button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">
              <i class="bi bi-x-circle me-1"></i> Скасувати
            </a>
            <a href="{% url 'password_change' %}" class="btn btn-warning">
              <i class="bi bi-key me-1"></i> Змінити пароль
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
