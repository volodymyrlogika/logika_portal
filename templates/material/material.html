{% extends 'base.html' %}


{% block content %}
{% for m in materials %}
<div class="container text-center">
    <div class="row" width: 85%>
        <div class="col">
            
            <h3>{{ m.name }}</h3>
            
            <h5>{{m.description}}</h5>
            <img src="{{m.image}}" alt="" width="330">
            <div class="row" width: 20%>
                    <a href="{{m.file.url}}">download file</a>
                    <iframe src="{{m.yt_url}}" title="" style="width: 20%; height: 15%; border: none"allowfullscreen></iframe>
                </div>
        </div>
        <p></p>
    <p style="text-align: left;">{{m.creator}}</p>
    </div>
</div>
{% endfor %}
{% endblock %}
