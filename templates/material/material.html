{% extends 'base.html' %}


{% block content %}
{% for m in materials %}
<div class="text-center">
    <div class="row" width: 85%>
        <div class="col">
            
            <h3>{{ m.name }}</h3>
            
            <h5>{{m.description}}</h5>
            {% if m.image %}
            <img src="{{m.image.url}}" alt="" width="330">
            {% endif %}
            <div class="row" width: 20%>
                {% if m.file %}
                <a href="{{m.file.url}}">download file</a>
                {% endif %}
                {% if m.yt_url %}
                    <iframe src="{{m.yt_url}}" title="" style="width: 20%; height: 15%; border: none"  referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                {% endif %}
                </div>
                    <a class="btn btn-primary" href="{% url 'delet_material' m.id %}" role="button">delete</a>
        </div>
        <p></p>
    <p style="text-align: left;">{{m.creator}}</p>
</div>
</div>
{% endfor %}
<a class="btn btn-primary" href="{% url 'add_material' %}" role="button">Додати новиі матеріали</a>
{% endblock %}
