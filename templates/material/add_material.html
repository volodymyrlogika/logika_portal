{% extends 'base.html' %}

{% block content %}

<div class="text-center">
    <div class="row" width: 85%>
        <div class="col">
            <h2>матеріали</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_name">Назва матеріалу</label>
                    <input type="text" class="form-control" id="id_name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="id_description">Опис</label>
                    <textarea class="form-control" id="id_description" name="description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="id_file">Файл</label>
                    <input type="file" class="form-control-file" id="id_file" name="file">
                </div>
                <div class="form-group">
                    <label for="id_image">Зображення</label>
                    <input type="file" class="form-control-file" id="id_image" name="image">
                </div>
                <div class="form-group">
                    <label for="id_yt_url">YouTube URL</label>
                    <input type="url" class="form-control" id="id_yt_url" name="yt_url">
                </div>
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}
                <button type="submit" class="btn btn-primary">Додати</button>
                <a class="btn btn-danger " href="{% url 'material' %}" role="button">Назад</a>
            </form>
        </div>
    </div>

{% endblock %}
