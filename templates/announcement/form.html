{% extends 'base.html' %}

{% block content %}
<h2>{{ view.object|default:"Нове оголошення" }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Зберегти</button>
    <a href="{% url 'announcement_list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
