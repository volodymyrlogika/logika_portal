{% extends "base.html" %}

{% block title %}{{ theme.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow-lg rounded-4">
    <div class="card-body">
      <h2 class="fw-bold mb-3">
        <i class="bi bi-palette text-warning"></i> {{ theme.name }}
      </h2>

      <p class="text-muted fs-5">
        {{ theme.description|default:"<em>Опис відсутній</em>" }}
      </p>

      <div class="mt-3 text-secondary small">
        <i class="bi bi-person-circle"></i> Автор: <strong>{{ theme.created_by.username }}</strong><br>
        <i class="bi bi-calendar-event"></i> {{ theme.created_at|date:"d.m.Y H:i" }}
      </div>

      <hr>

      <div class="d-flex gap-2">
        <a href="{% url 'themes:home' %}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Назад
        </a>
        <a href="{% url 'themes:theme_update' theme.pk %}" class="btn btn-warning">
          <i class="bi bi-pencil-square"></i> Редагувати
        </a>
        <a href="{% url 'themes:theme_delete' theme.pk %}" class="btn btn-danger">
          <i class="bi bi-trash"></i> Видалити
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
