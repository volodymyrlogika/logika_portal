{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card bg-dark text-light shadow-lg p-4 rounded">
        <h2 class="mb-4"><i class="bi bi-palette"></i> Нова тема</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="mb-3">
                <label for="{{ form.name.id_for_label }}" class="form-label">Назва:</label>
                {{ form.name|add_class:"form-control" }}
            </div>

            <div class="mb-3">
                <label for="{{ form.description.id_for_label }}" class="form-label">Опис:</label>
                {{ form.description|add_class:"form-control" }}
            </div>

            <div class="mb-3">
                <label for="{{ form.image.id_for_label }}" class="form-label">Обкладинка:</label>
                {{ form.image|add_class:"form-control" }}
            </div>

            <div class="mb-3">
                <label for="{{ form.tags.id_for_label }}" class="form-label">Теги:</label>
                {{ form.tags|add_class:"form-control" }}
            </div>

            <!-- Кнопки -->
            <div class="d-flex flex-wrap gap-2 mt-3">
                <button type="submit" name="action" value="publish" class="btn btn-success">
                    <i class="bi bi-check-circle"></i> Опублікувати
                </button>
                <button type="submit" name="action" value="draft" class="btn btn-warning">
                    <i class="bi bi-file-earmark-text"></i> Чернетка
                </button>
                <button type="reset" class="btn btn-danger">
                    <i class="bi bi-x-circle"></i> Очистити
                </button>
                <button type="button" class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#previewModal">
                    <i class="bi bi-eye"></i> Попередній перегляд
                </button>
                <a href="{% url 'themes:list' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Назад
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap Modal -->
<div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title" id="previewTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
      </div>
      <div class="modal-body">
        <p id="previewDescription"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i> Закрити
        </button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const previewBtn = document.querySelector('[data-bs-target="#previewModal"]');
    previewBtn.addEventListener("click", () => {
        document.getElementById("previewTitle").innerText = document.getElementById("id_name").value;
        document.getElementById("previewDescription").innerText = document.getElementById("id_description").value;
    });
});
</script>
{% endblock %}
