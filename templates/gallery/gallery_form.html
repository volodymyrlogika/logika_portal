{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h1 class="mb-3">Завантажити до галереї</h1>

  <form method="post" enctype="multipart/form-data" class="mb-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Надіслати на модерацію</button>
  </form>

  <p class="text-muted small">
    Після відправки матеріал побачать лише модератори. 
    Публікація відбудеться після схвалення.
  </p>
</div>
{% endblock %}
