{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl mb-3">Галерея</h1>
<div class="mb-3 d-flex gap-2">
<a class="btn btn-primary" href="{% url 'gallery:upload' %}">Завантажити</a>
{% if request.user.is_staff %}
  <a class="btn btn-warning" href="{% url 'gallery:moderation' %}">Модерація</a>


  {% endif %}
</div>
<div class="row g-3">
  {% for item in items %}
    <div class="col-6 col-md-3">
      <div class="bg-dark p-2 rounded h-100">
        {% if item.media_type == 'image' %}
          <img src="{{ item.file.url }}" alt="{{ item.title }}" class="img-fluid rounded">
        {% else %}
          <video src="{{ item.file.url }}" controls class="w-100 rounded"></video>
        {% endif %}
        <div class="small mt-1">{{ item.title }}</div>
      </div>
    </div>
  {% empty %}
    <p class="text-muted">Матеріали відсутні.</p>
  {% endfor %}
</div>
{% endblock %}
