<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} Сайт {% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link id="theme-style" rel="stylesheet" href="{% static 'css/light.css' %}">
    <style>
      #konami-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        color: white;
        font-size: 2rem;
        text-align: center;
        padding-top: 20%;
        z-index: 9999;
      }
    </style>
</head>
<body>
    {% include 'menu.html' %}

    <!-- 🔘 Перемикач тем -->
    <div class="text-end p-2">
      <button class="btn btn-sm btn-outline-primary" onclick="setTheme('light')"><i class="bi bi-sun"></i></button>
      <button class="btn btn-sm btn-outline-dark" onclick="setTheme('dark')"><i class="bi bi-moon"></i></button>
    </div>

    <main class="container my-4">
    {% block content %}
    {% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- Overlay для конамі-коду -->
    <div id="konami-overlay">
      🎉 Секретний режим активовано! 🎉 <br>
      <button class="btn btn-light mt-3" onclick="document.getElementById('konami-overlay').style.display='none'">Закрити</button>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
      // ===== Теми =====
      function setTheme(theme) {
        document.getElementById("theme-style").href = `/static/css/${theme}.css`;
        localStorage.setItem("theme", theme);
      }
      window.onload = function() {
        let theme = localStorage.getItem("theme") || "light";
        setTheme(theme);
      }

      // ===== Конамі-код =====
      const konami = [38,38,40,40,37,39,37,39,66,65]; // ↑↑↓↓←→←→BA
      let input = [];
      document.addEventListener("keydown", function(e) {
        input.push(e.keyCode);
        if (input.toString().indexOf(konami.toString()) >= 0) {
          document.getElementById("konami-overlay").style.display = "block";
          input = [];
        }
      });
    </script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
