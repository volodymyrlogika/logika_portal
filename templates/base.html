<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Сайт {% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    {% load static %}
    <!-- Єдиний CSS -->
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">

    <style>
      #konami-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        color: white;
        font-size: 2rem;
        text-align: center;
        padding-top: 20%;
        z-index: 9999;
      }
    </style>
</head>
<body>
    {% include 'menu.html' %}
    {% include 'alerts.html' %}

    <main class="container my-4">
      {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- Overlay -->
    <div id="konami-overlay">
      <i class="bi bi-stars"></i> Секретний режим активовано! <i class="bi bi-stars"></i> <br>
      <button class="btn btn-light mt-3" onclick="document.getElementById('konami-overlay').style.display='none'">Закрити</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
