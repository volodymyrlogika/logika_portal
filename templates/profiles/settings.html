{% extends "base.html" %}
{% block title %}Налаштування{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="card-title"><i class="bi bi-gear"></i> Налаштування профілю</h2>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_first_name" class="form-label">Ім’я</label>
        {{ form.first_name }}
      </div>
      <div class="mb-3">
        <label for="id_last_name" class="form-label">Прізвище</label>
        {{ form.last_name }}
      </div>
      <div class="mb-3">
        <label for="id_email" class="form-label">Email</label>
        {{ form.email }}
      </div>
      <div class="mb-3">
        <label for="id_theme" class="form-label">Тема сайту</label>
        {{ form.theme }}
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Зберегти</button>
    </form>
  </div>
</div>
{% endblock %}
