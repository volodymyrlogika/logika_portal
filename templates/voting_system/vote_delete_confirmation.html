{% extends "base.html" %}

{% block content %}
    <h2>Видалення голосування</h2>
    <p>Ви впевнені, що хочете видалити голосування "{{ object.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Так, видалити</button>
        <a href="{% url 'vote-list' %}" class="btn btn-secondary">Ні, повернутися до списку голосуваннь</a>
    </form>
{% endblock %}
