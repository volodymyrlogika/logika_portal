{% extends "base.html" %}

{% block title %}Казіно{% endblock %}

{% block content %}
<div class="text-center">
  <h1 class="fw-bold text-danger mb-4">
    🎰 Казино: Слоти
  </h1>

  <!-- Слоти -->
  <div class="slot-machine mx-auto mb-4">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">🍉</div>
  </div>

  <!-- Кнопка -->
  <button id="spinBtn" class="btn btn-warning btn-lg fw-bold">
    <i class="bi bi-play-fill"></i> Крутити!
  </button>

  <!-- Результат -->
  <p class="lead mt-4 fw-bold" id="resultText"></p>
</div>

<style>
/* Контейнер */
.slot-machine {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px auto;
}

/* Барабан */
.reel {
  width: 100px;
  height: 100px;
  font-size: 60px;
  border: 3px solid #333;
  border-radius: 15px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  animation: none;
}

/* Анімація кручення */
@keyframes spin {
  0% { transform: rotateX(0deg); }
  100% { transform: rotateX(720deg); }
}
</style>

<script>
const symbols = ["🍒","🍋","🍉","⭐","🔔","7️⃣"];
const reels = [
  document.getElementById("reel1"),
  document.getElementById("reel2"),
  document.getElementById("reel3")
];
const resultText = document.getElementById("resultText");
const spinBtn = document.getElementById("spinBtn");

spinBtn.addEventListener("click", () => {
  resultText.textContent = "";
  
  reels.forEach((reel, i) => {
    reel.style.animation = "spin 1s linear infinite";

    setTimeout(() => {
      reel.style.animation = "none";
      const symbol = symbols[Math.floor(Math.random() * symbols.length)];
      reel.textContent = symbol;

      // Коли зупинився останній барабан → показати результат
      if (i === reels.length - 1) {
        checkResult();
      }
    }, 1000 + i * 500); // затримка для кожного барабана
  });
});

function checkResult() {
  const [a, b, c] = reels.map(r => r.textContent);
  if (a === b && b === c) {
    resultText.textContent = "🎉 Джекпот! Три " + a + "!";
    resultText.className = "text-success fw-bold";
  } else if (a === b || b === c || a === c) {
    resultText.textContent = "✨ Майже! Два співпали!";
    resultText.className = "text-warning fw-bold";
  } else {
    resultText.textContent = "😢 Спробуй ще раз!";
    resultText.className = "text-danger fw-bold";
  }
}
</script>
{% endblock %}
