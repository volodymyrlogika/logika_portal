{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <div class="card shadow-sm bg-dark text-light rounded-4">
    <div class="card-body">
      <h1 class="h4 mb-4">
        {% if form.instance.pk %}
          Редагувати воркшоп
        {% else %}
          Створити новий воркшоп
        {% endif %}
      </h1>

      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        <div class="mb-3">
          <label for="id_title" class="form-label">Назва воркшопу</label>
          <input type="text" name="title" class="form-control" id="id_title"
                 value="{{ form.title.value|default_if_none:'' }}">
        </div>

        <div class="mb-3">
          <label for="id_description" class="form-label">Опис</label>
          <textarea name="description" class="form-control" id="id_description" rows="4">{{ form.description.value|default_if_none:'' }}</textarea>
        </div>

        <div class="mb-3">
          <label for="id_date" class="form-label">Дата проведення</label>
          <input type="date" name="date" class="form-control" id="id_date"
                 value="{{ form.date.value|default_if_none:'' }}">
        </div>

        <div class="mb-3">
          <label for="id_image" class="form-label">Зображення</label>
          <input type="file" name="image" class="form-control" id="id_image">
          {% if form.instance.image %}
            <div class="mt-2">
              <img src="{{ form.instance.image.url }}" alt="Workshop image" class="img-thumbnail" style="max-height: 200px;">
            </div>
          {% endif %}
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-lg"></i> Зберегти
          </button>
          <a href="{% url 'workshops:list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Назад
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
