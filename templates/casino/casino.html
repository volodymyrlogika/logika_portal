{% extends "base.html" %}

{% block title %}Казино{% endblock %}

{% block content %}
<div class="text-center">
  <h1 class="fw-bold text-danger mb-4"><i class="bi bi-casino"></i> Казино</h1>

  <!-- Меню ігор -->
  <div class="mb-4">
    <button class="btn btn-outline-danger mx-2" onclick="showGame('slots')">
      <i class="bi bi-slot"></i> Слоти
    </button>
    <button class="btn btn-outline-primary mx-2" onclick="showGame('rps')">
      <i class="bi bi-hand-index-thumb"></i> Камінь-Ножиці-Папір
    </button>
    <button class="btn btn-outline-success mx-2" onclick="showGame('dice')">
      <i class="bi bi-dice-5"></i> Кубик
    </button>
  </div>

  <!-- Ігри -->
  <div id="slots" class="game">
    {% include "casino/slots.html" %}
  </div>

  <div id="rps" class="game d-none">
    {% include "casino/rps.html" %}
  </div>

  <div id="dice" class="game d-none">
    {% include "casino/dice.html" %}
  </div>
</div>

<script>
function showGame(id) {
  document.querySelectorAll(".game").forEach(el => el.classList.add("d-none"));
  document.getElementById(id).classList.remove("d-none");
}
</script>
{% endblock %}
