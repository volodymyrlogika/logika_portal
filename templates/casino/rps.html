<div class="card shadow-lg mb-4">
  <div class="card-body text-center">
    <h3>✊✋✌ Камінь-Ножиці-Папір</h3>
    
    <div class="d-flex justify-content-center align-items-center my-4">
      <div id="playerHand" class="hand player">✊</div>
      <div class="vs-text">VS</div>
      <div id="cpuHand" class="hand cpu">✊</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-danger" onclick="playRPS('✊')">✊ Камінь</button>
      <button class="btn btn-success" onclick="playRPS('✋')">✋ Папір</button>
      <button class="btn btn-warning" onclick="playRPS('✌')">✌ Ножиці</button>
    </div>

    <p id="rpsMessage" class="mt-3 fw-bold"></p>
  </div>
</div>

<style>
.hand {
  font-size: 5rem;
  margin: 0 20px;
  transition: transform 0.3s ease;
}
.vs-text {
  font-size: 2rem;
  font-weight: bold;
  margin: 0 20px;
}
.shake {
  animation: shake 0.6s infinite;
}
@keyframes shake {
  0% { transform: translateY(0); }
  25% { transform: translateY(-15px); }
  50% { transform: translateY(0); }
  75% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}
</style>

<script>
function playRPS(playerChoice) {
  const choices = ["✊", "✋", "✌"];
  const cpuChoice = choices[Math.floor(Math.random() * choices.length)];

  const playerHand = document.getElementById("playerHand");
  const cpuHand = document.getElementById("cpuHand");
  const msgEl = document.getElementById("rpsMessage");

  // скидаємо
  playerHand.innerText = "✊";
  cpuHand.innerText = "✊";
  msgEl.innerText = "";

  // запускаємо "качання кулаків"
  playerHand.classList.add("shake");
  cpuHand.classList.add("shake");

  setTimeout(() => {
    // зупиняємо руки
    playerHand.classList.remove("shake");
    cpuHand.classList.remove("shake");

    // показуємо вибір
    playerHand.innerText = playerChoice;
    cpuHand.innerText = cpuChoice;

    // визначаємо переможця
    if (playerChoice === cpuChoice) {
      msgEl.innerText = "🤝 Нічия!";
    } else if (
      (playerChoice === "✊" && cpuChoice === "✌") ||
      (playerChoice === "✋" && cpuChoice === "✊") ||
      (playerChoice === "✌" && cpuChoice === "✋")
    ) {
      msgEl.innerText = "🎉 Ти виграв!";
    } else {
      msgEl.innerText = "💀 CPU виграв!";
    }
  }, 2000); // 2 секунди "дуелі"
}
</script>
