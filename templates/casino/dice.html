<div class="card shadow-lg mb-4">
  <div class="card-body text-center">
    <h3>🎲 Кубик</h3>

    <div class="dice-wrapper">
      <div id="diceResult" class="dice">⚀</div>
    </div>

    <button class="btn btn-primary mt-3" onclick="rollDice()">
      <i class="bi bi-arrow-repeat"></i> Кинути
    </button>
  </div>
</div>

<style>
.dice-wrapper {
  width: 100px;
  height: 100px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto;
}

.dice {
  font-size: 4rem;
  display: inline-block;
}

.dice.spin {
  animation: rollDiceAnim 0.6s linear infinite;
}

@keyframes rollDiceAnim {
  0%   { transform: rotate(0deg) scale(1); }
  25%  { transform: rotate(90deg) scale(1.2); }
  50%  { transform: rotate(180deg) scale(0.8); }
  75%  { transform: rotate(270deg) scale(1.2); }
  100% { transform: rotate(360deg) scale(1); }
}

/* 👇 відскок у кінці */
.dice.bounce {
  animation: bounceAnim 0.4s ease;
}

@keyframes bounceAnim {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.3); }
  60%  { transform: scale(0.9); }
  100% { transform: scale(1); }
}
</style>

<script>
const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

function rollDice() {
  const diceEl = document.getElementById("diceResult");

  diceEl.classList.add("spin");

  // Крутиться випадковими гранями
  let interval = setInterval(() => {
    let rand = diceFaces[Math.floor(Math.random() * 6)];
    diceEl.innerText = rand;
  }, 100);

  // Зупинка
  setTimeout(() => {
    clearInterval(interval);
    diceEl.classList.remove("spin");

    let result = diceFaces[Math.floor(Math.random() * 6)];
    diceEl.innerText = result;

    // 👇 додаємо bounce у фіналі
    diceEl.classList.add("bounce");
    setTimeout(() => diceEl.classList.remove("bounce"), 400);

  }, 1000);
}
</script>
