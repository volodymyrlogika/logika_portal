{% extends 'base.html' %}
{% block content %}

<h2>всі Категорії</h2>
<ul>
    {% for category in categories %}
        <li>
            <a href="{% url 'forum:thread-list' category_id=category.id %}">
                <p> назва:{{ category.name }} опис {{ category.description }} тип {{ category.type }}</p>

    {% endfor %}
</ul>

    
{% endblock content %}
