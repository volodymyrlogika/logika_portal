{% extends 'base.html' %}
{% block content %}
<h1>ви попали на сторінку тем</h1>


<h2>Треди категорії {{ category_id }}</h2>
<ul>
    {% for thread in threads %}
        <li>

        </li>
    {% endfor %}
</ul>

{% endblock content %}
