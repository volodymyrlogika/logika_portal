{% extends 'base.html' %}
{% block content %}
{% for thread in threads %}

<p>тема {{ thread.theme }}</p>
{% endfor %}
{% for category in categories %}
<li>
    <a href="{% url 'forum:thread-list' category_id=category.id %}">
        <p>категорія {{ category.name }} {{ category.description }} {{ category.type }}</p>
    </a>
</li>

{% endfor %}
{% endblock content %}
