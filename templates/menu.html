{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <!-- Логотип -->
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-grid-3x3-gap-fill me-1"></i> Logika Portal
    </a>

    <!-- Кнопка для мобільного меню -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Меню -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'workshops:home' %}">
            <i class="bi bi-journal-text me-1"></i> Воркшопи
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'gallery:home' %}">
            <i class="bi bi-image me-1"></i> Галерея
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'themes:home' %}">
            <i class="bi bi-palette me-1"></i> Теми
          </a>
        </li>
      </ul>

      <!-- Права частина -->
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <button id="themeToggle" class="btn btn-sm btn-outline-light me-2">
            <i id="themeIcon" class="bi bi-moon"></i>
            <span id="themeText">Темна</span>
          </button>
        </li>

        {% if user.is_authenticated %}
          <li class="nav-item d-flex align-items-center me-2">
            <span class="nav-link">
              <i class="bi bi-person-circle me-1"></i> {{ user.username }}
            </span>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-outline-danger" href="{% url 'logout' %}">
              <i class="bi bi-box-arrow-right"></i> Вийти
            </a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="btn btn-sm btn-outline-primary" href="{% url 'login' %}">
              <i class="bi bi-box-arrow-in-right"></i> Увійти
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
