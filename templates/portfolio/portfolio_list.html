<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Портфоліо користувачів</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 20px;
            margin: 10px 0 5px;
        }
        .card p {
            font-size: 14px;
            color: #444;
        }
        .card a {
            display: inline-block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .add-btn {
            display: block;
            width: max-content;
            margin: 20px auto;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }
        .add-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Портфоліо користувачів</h1>

    <a href="{% url 'portfolio_create' %}" class="add-btn">➕ Додати портфоліо</a>

    <div class="portfolio">
        {% for item in portfolio %}
            <div class="card">
                <h2>{{ item.title }}</h2>
                <p><b>Автор:</b> {{ item.user.username }}</p>
                <p>{{ item.description }}</p>
                {% if item.link %}
                    <a href="{{ item.link }}" target="_blank">Переглянути роботу</a>
                {% endif %}
                <p><small>Створено: {{ item.created_at }}</small></p>
            </div>
        {% empty %}
            <p>Портфоліо поки що немає.</p>
        {% endfor %}
    </div>
</body>
</html>
